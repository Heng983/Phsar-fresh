services:
  postgres:
    image: postgres:16
    container_name: phsar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: phsar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: phsar_fresh
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: phsar-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"

volumes:
  pgdata:
